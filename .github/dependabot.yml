version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor/patch flow automatically in one weekly PR; majors go through the
      # tech-debt report and a deliberate migration instead of an auto PR.
      minor-and-patch:
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # prisma 6.13+ pulls deepmerge-ts <8 (GHSA-ggr8-5vv4-36mx, high) — blocked by
      # the audit gate until a patched 6.x ships; revisit deliberately.
      - dependency-name: "prisma"
      - dependency-name: "@prisma/client"


  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
