name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --coverage

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vovinam
          POSTGRES_PASSWORD: vovinam
          POSTGRES_DB: vovinam_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vovinam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vovinam:vovinam@localhost:5432/vovinam_migrate?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Assert all expected tables exist
        run: |
          TABLE_COUNT=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','sessions','refresh_tokens','totp_credentials','recovery_codes','used_tokens','audit_logs','app_settings','belt_ranks','_prisma_migrations')")
          echo "Expected tables found: $TABLE_COUNT"
          test "$TABLE_COUNT" -eq 10
      - name: Verify migrations replay cleanly from scratch
        run: |
          npx prisma migrate reset --force
          npx prisma migrate deploy

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vovinam
          POSTGRES_PASSWORD: vovinam
          POSTGRES_DB: vovinam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vovinam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vovinam:vovinam@localhost:5432/vovinam_test?schema=public
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vovinam-api:ci .

  deploy:
    needs: [lint, build-test, migration-dry-run, integration, audit, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK secret not configured; deploy-gate is a stub until the Render service exists"
          fi
