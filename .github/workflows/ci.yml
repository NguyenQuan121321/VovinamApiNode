name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (GITHUB_TOKEN stays read-only; no job needs write access).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Light, fully parallel first wave ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  secrets-scan:
    name: secrets-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --verbose --redact

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep security rules (OWASP top ten, TypeScript, secrets)
        id: sast
        run: |
          set +e
          # Excluded rules are documented false positives:
          # - detected-bcrypt-hash: the timing-equalization dummy hash in
          #   src/auth/auth.service.ts hashes a throwaway string and unlocks nothing.
          # - gcm-no-tag-length: the GCM auth tag length IS pinned to 16 in
          #   src/auth/mfa/seal.service.ts; @types/node does not model the length arg.
          docker run --rm -v "$PWD:/src" --workdir /src \
            semgrep/semgrep:latest semgrep scan \
            --config p/owasp-top-ten --config p/typescript --config p/secrets \
            --metrics=off --json --output /src/semgrep-report.json \
            --exclude-rule generic.secrets.security.detected-bcrypt-hash.detected-bcrypt-hash \
            --exclude-rule javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore
      - name: Fail on Semgrep findings (emitted as annotations)
        run: |
          node -e "
            const report = require('./semgrep-report.json');
            const results = report.results ?? [];
            console.log('Semgrep findings:', results.length);
            for (const r of results.slice(0, 30)) {
              const line = r.start?.line ?? 1;
              console.log('::error file=' + r.path + ',line=' + line + ',title=' + r.check_id + '::' + String(r.extra?.message ?? '').split('\n')[0].slice(0, 120));
            }
            process.exit(results.length === 0 ? 0 : 1);
          "

  audit:
    name: audit (npm audit high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  license-check:
    name: license-check (no GPL/AGPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/license-check.js

  commitlint:
    name: commitlint (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Allow repository phase naming convention (e.g., Phase/2 domain core, Phase/1 auth)
          # which is the project standard established on PRs #1, #7, #12.
          if echo "$PR_TITLE" | grep -Eq '^[Pp]hase/[0-9]+'; then
            echo "PR title matches project Phase/<N> naming convention: $PR_TITLE"
            echo "::notice title=PR Title Convention::PR title matches Phase/<N> convention ($PR_TITLE)."
            exit 0
          fi
          if ! echo "$PR_TITLE" | npx commitlint; then
            echo "::error title=Invalid PR Title::PR title '$PR_TITLE' must follow Conventional Commits (e.g. 'feat(students): description') or Phase naming ('Phase/2 domain core'). Please edit the PR title in GitHub."
            exit 1
          fi
      - name: Lint commits in the PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

  tech-debt-gate:
    name: tech-debt-gate (extraneous deps, outdated report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on extraneous packages (leftover install junk)
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const data = JSON.parse(execSync('npm prune --dry-run --json', { encoding: 'utf8' }));
            const removed = Number(data.removed ?? 0);
            console.log('npm prune would remove:', removed, 'package(s)');
            if (removed !== 0) {
              console.error('::error::Extraneous packages detected — run npm prune locally and re-lock dependencies');
              process.exit(1);
            }
            console.log('No extraneous packages');
          "
      - name: Report outdated dependencies (non-blocking)
        run: |
          npm outdated || echo "::notice::Outdated dependencies listed above; major versions are deliberately migrated, minor/patch arrive weekly via Dependabot"

  # ── Heavy verification wave ─────────────────────────────────────────────────
  build-test:
    name: build-test (typecheck, unit, coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # jest --coverage fails the job when the 75% floor (auth/billing/classes, plan 12)
      # is not met: the coverage gate.
      - run: npm test -- --coverage

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vovinam
          POSTGRES_PASSWORD: vovinam
          POSTGRES_DB: vovinam_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vovinam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vovinam:vovinam@localhost:5432/vovinam_migrate?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Assert all expected tables exist
        run: |
          # Plain libpq URI: psql rejects Prisma's ?schema=public query parameter.
          TABLE_COUNT=$(psql "postgresql://vovinam:vovinam@localhost:5432/vovinam_migrate" -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','sessions','refresh_tokens','totp_credentials','recovery_codes','used_tokens','audit_logs','app_settings','belt_ranks','student_profiles','parent_student_links','_prisma_migrations')")
          echo "Expected tables found: $TABLE_COUNT"
          test "$TABLE_COUNT" -eq 12
      - name: Verify migrations replay cleanly from scratch
        run: |
          npx prisma migrate reset --force
          npx prisma migrate deploy

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vovinam
          POSTGRES_PASSWORD: vovinam
          POSTGRES_DB: vovinam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vovinam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vovinam:vovinam@localhost:5432/vovinam_test?schema=public
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      APP_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Run e2e suite (full output emitted as annotations on failure)
        run: |
          set +e
          npm run test:e2e > e2e-output.txt 2>&1
          EXIT=$?
          if [ "$EXIT" != "0" ]; then
            # The output is small (~1KB); mirror every line into annotations so the
            # failure is readable on the PR without Actions log access.
            grep -v '^$' e2e-output.txt | head -45 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | cut -c1-160)
              echo "::error title=e2e::$safe"
            done
          fi
          exit $EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: e2e-output.txt
          if-no-files-found: ignore

  contract-gate:
    name: contract-gate (OpenAPI spectral + staleness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate the OpenAPI document
        env:
          NODE_ENV: local
          DATABASE_URL: postgresql://u:p@localhost:5432/unused?schema=public
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
          APP_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
        run: npm run openapi:generate
      - name: Fail when the committed contract is stale
        run: |
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json is stale — run 'npm run openapi:generate' and commit the result"
            exit 1
          }
          echo "Committed contract matches the generated one"
      - name: Spectral lint (contract quality)
        run: npx spectral lint openapi.json --fail-severity=error

  # ── Image build and scan (only after heavy verification passed) ─────────────
  docker:
    needs: [lint, secrets-scan, sast, audit, build-test, migration-dry-run, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (GitHub Actions layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vovinam-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-scan:
    name: container-scan (trivy)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Restore image from the buildx cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vovinam-api:ci
          cache-from: type=gha
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/report" -w /report aquasec/trivy:0.74.0 image \
            --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL \
            --skip-files "/usr/local/lib/node_modules/npm/**" \
            --format json --output /report/trivy-report.json vovinam-api:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
      - name: Fail on Trivy findings (emitted as annotations)
        run: |
          node -e "
            const report = require('./trivy-report.json');
            const vulns = (report.Results ?? []).flatMap((r) => r.Vulnerabilities ?? []);
            console.log('Trivy HIGH/CRITICAL (unfixed excluded):', vulns.length);
            for (const v of vulns.slice(0, 30)) {
              console.log('::error title=' + v.VulnerabilityID + ' ' + v.PkgName + '::fixed=' + (v.FixedVersion ?? 'none') + ' - ' + String(v.Title ?? '').slice(0, 100));
            }
            process.exit(vulns.length === 0 ? 0 : 1);
          "

  # ── Deploy + post-deploy smoke test (main pushes only) ──────────────────────
  deploy:
    name: deploy + smoke test
    needs:
      - lint
      - secrets-scan
      - sast
      - audit
      - license-check
      - tech-debt-gate
      - build-test
      - migration-dry-run
      - integration
      - contract-gate
      - docker
      - container-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      SMOKE_TEST_URL: ${{ secrets.SMOKE_TEST_URL }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK secret not configured; deploy-gate is a stub until the Render service exists"
          fi
      - name: Post-deploy smoke test (healthcheck gate)
        run: |
          if [ -z "$SMOKE_TEST_URL" ]; then
            echo "SMOKE_TEST_URL secret not configured; smoke test is a stub until the production URL exists"
            exit 0
          fi
          echo "Polling $SMOKE_TEST_URL/healthz until the new deployment answers..."
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 5 "$SMOKE_TEST_URL/healthz" || true)
            if [ "$STATUS" = "200" ]; then
              echo "healthz OK after attempt $i"
              READY=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 5 "$SMOKE_TEST_URL/readyz" || true)
              if [ "$READY" = "200" ]; then
                echo "readyz OK — database reachable, deployment accepted"
                exit 0
              fi
              echo "::error::healthz answered but readyz returned $READY — database not reachable"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Smoke test failed: /healthz never returned 200 within 5 minutes"
          exit 1
