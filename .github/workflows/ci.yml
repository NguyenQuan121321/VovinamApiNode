name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  secrets-scan:
    name: secrets-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --verbose --redact

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep security rules (OWASP top ten, TypeScript, secrets)
        run: |
          docker run --rm -v "$PWD:/src" --workdir /src \
            returntocorp/semgrep:latest semgrep scan \
            --config p/owasp-top-ten --config p/typescript --config p/secrets \
            --error --metrics=off

  build-test:
    name: build-test (typecheck, unit, coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # jest --coverage fails the job when the 75% floor (auth/billing/classes, plan 12)
      # is not met: the coverage gate.
      - run: npm test -- --coverage

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vovinam
          POSTGRES_PASSWORD: vovinam
          POSTGRES_DB: vovinam_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vovinam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vovinam:vovinam@localhost:5432/vovinam_migrate?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Assert all expected tables exist
        run: |
          # Plain libpq URI: psql rejects Prisma's ?schema=public query parameter.
          TABLE_COUNT=$(psql "postgresql://vovinam:vovinam@localhost:5432/vovinam_migrate" -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','sessions','refresh_tokens','totp_credentials','recovery_codes','used_tokens','audit_logs','app_settings','belt_ranks','_prisma_migrations')")
          echo "Expected tables found: $TABLE_COUNT"
          test "$TABLE_COUNT" -eq 10
      - name: Verify migrations replay cleanly from scratch
        run: |
          npx prisma migrate reset --force
          npx prisma migrate deploy

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vovinam
          POSTGRES_PASSWORD: vovinam
          POSTGRES_DB: vovinam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vovinam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vovinam:vovinam@localhost:5432/vovinam_test?schema=public
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      APP_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  audit:
    name: audit (npm audit high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  container-scan:
    name: container-scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vovinam-api:ci .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL vovinam-api:ci

  tech-debt-gate:
    name: tech-debt-gate (unused deps, outdated report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on extraneous packages (leftover install junk)
        run: |
          PRUNE_OUTPUT=$(npm prune --dry-run)
          if [ "$PRUNE_OUTPUT" != "up to date" ] && [ -n "$PRUNE_OUTPUT" ]; then
            echo "$PRUNE_OUTPUT"
            echo "::error::Extraneous packages detected — remove them and re-lock dependencies"
            exit 1
          fi
          echo "No extraneous packages"
      - name: Report outdated dependencies (non-blocking)
        run: |
          npm outdated || echo "::notice::Outdated dependencies listed above; major versions are deliberately migrated, minor/patch arrive weekly via Dependabot"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vovinam-api:ci .

  deploy:
    needs:
      - lint
      - secrets-scan
      - sast
      - build-test
      - migration-dry-run
      - integration
      - audit
      - container-scan
      - tech-debt-gate
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK secret not configured; deploy-gate is a stub until the Render service exists"
          fi
