services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vovinam
      POSTGRES_PASSWORD: vovinam
      POSTGRES_DB: vovinam
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vovinam -d vovinam']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
