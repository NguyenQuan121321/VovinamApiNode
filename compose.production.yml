services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vovinam
      POSTGRES_DB: vovinam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vovinam -d vovinam']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${VOVINAM_IMAGE:?VOVINAM_IMAGE must identify a tested immutable image}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: 1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    profiles: ['operations']
    image: ${VOVINAM_IMAGE:?VOVINAM_IMAGE is required}
    env_file: .env.production
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      db:
        condition: service_healthy

volumes:
  production_pgdata:
